server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Ligne magique : si Nginx ne trouve pas le fichier demandé, 
        # il renvoie l'index.html pour laisser React Router faire son travail.
        try_files $uri $uri/ /index.html;
    }

    # Optionnel : Gestion des erreurs du serveur
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}